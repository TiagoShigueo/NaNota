

services:
  mysql-db:
    image: mysql:8.0
    container_name: nanota-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: nanota_root_password
      MYSQL_DATABASE: nanota_db
      MYSQL_USER: nanota_user
      MYSQL_PASSWORD: nanota_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: