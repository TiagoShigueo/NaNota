spring.application.name=backend
# Conexão com a porta 3307
spring.datasource.url=jdbc:mysql://localhost:3307/nanota_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=nanota_user
spring.datasource.password=nanota_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect